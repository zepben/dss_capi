[package]
name = "rmqstream"
version = "0.1.2"
edition = "2024"

[lib]
# Create statically-linked library for C interop
name = "rmqstream"
crate-type = ["staticlib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
libc = "0.2"
rabbitmq-stream-client = "0.10.0"
tokio = { version = "1.49.0", features = ["rt", "rt-multi-thread", "time"] }
tracing = { version = "0.1.44", features = [] }
tracing-subscriber = "0.3.22"
tracing-log = "0.2.0"
rand = "0.10.1"


[dev-dependencies]
ntest = "0.9.5"
tokio = { version = "1.49.0", features = ["rt", "rt-multi-thread", "time", "test-util"] }
